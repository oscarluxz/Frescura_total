<g><rect x="105" y="420" width="290" height="115" rx="9" fill="#dcfce7" stroke="#16a34a"/><text x="250" y="456" font-size="18" font-weight="bold">CustomerService</text><text x="250" y="484" font-size="14">validates customer data</text><text x="250" y="509" font-size="13">calls repository</text></g>
<g><rect x="105" y="590" width="290" height="115" rx="9" fill="#fef3c7" stroke="#d97706"/><text x="250" y="626" font-size="18" font-weight="bold">CustomerRepositoryImpl</text><text x="250" y="654" font-size="14">JDBC customer CRUD</text></g>
<g><rect x="565" y="110" width="290" height="85" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="710" y="145" font-size="18" font-weight="bold">SalesView</text><text x="710" y="173" font-size="14">products, cart, receipt</text></g>
